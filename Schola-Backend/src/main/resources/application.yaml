spring:
  application:
    name: Schola-Backend

  datasource:
    url:      ${DB_url}
    username: ${Db_username}
    password: ${Db_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    user:
      name: admin
      password: admin

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000